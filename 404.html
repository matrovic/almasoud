<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Redirecting…</title>
<script>
var p = location.pathname.replace(/\/+$/, '');
if (p && !/\.[a-z0-9]+$/i.test(p) && !sessionStorage.getItem('r404')) {
  sessionStorage.setItem('r404', '1');
  location.replace(p + '.html' + location.search + location.hash);
} else { sessionStorage.removeItem('r404'); }
</script></head>
<body style="font-family:sans-serif;text-align:center;padding:60px">
<h1>Page not found</h1><p><a href="/">Back to home</a></p></body></html>
